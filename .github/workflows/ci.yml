name: CampusArc CI

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: Syntax check
        run: |
          find . -type f -name '*.js' -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check
      - name: Database migration smoke test
        env:
          JWT_SECRET: campusarc-ci-secret-012345678901234567890123
          DB_PATH: /tmp/campusarc-ci.sqlite
        run: npm run db:init
      - name: Backend boot smoke test
        env:
          JWT_SECRET: campusarc-ci-secret-012345678901234567890123
          DB_PATH: /tmp/campusarc-ci.sqlite
        run: |
          node - <<'NODE'
          const { app } = require('./server');
          const http = require('http');
          const server = app.listen(0, async () => {
            const port = server.address().port;
            const response = await fetch(`http://127.0.0.1:${port}/health`);
            const body = await response.json();
            if (response.status !== 200 || body.product !== 'CampusArc AI') process.exitCode = 1;
            server.close();
          });
          NODE

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run build
